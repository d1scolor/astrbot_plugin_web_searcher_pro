[project]
name = "astrbot-plugin-web-searcher-pro"
version = "1.3.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "beautifulsoup4>=4.12",
    "curl-cffi>=0.13,<1",
    "Pillow>=11",
    "readability-lxml>=0.8",
    "yarl>=1.12,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F403", "F405"]
