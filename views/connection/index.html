<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Guard 连接测试</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 760px; padding: 24px; margin: auto; line-height: 1.6; }
    button { padding: 10px 20px; cursor: pointer; font-size: 1rem; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 16px; background: #8882; border-radius: 8px; }
    #status { font-weight: 600; }
  </style>
</head>
<body>
  <h2>Prompt Guard 连接测试 / Connection test</h2>
  <p>先在插件配置中保存 URL、Token 和超时，然后重载插件。测试使用已加载的配置，不读取未保存的表单内容。</p>
  <p>检查健康状态、鉴权和固定无害文本的扫描结果。不发送搜索内容或聊天记录，不显示 Token。关闭过滤时也可测试连接。</p>
  <button id="test" disabled>测试连接 / Test connection</button>
  <p id="status" role="status" aria-live="polite">正在连接 AstrBot…</p>
  <pre id="result" hidden></pre>
  <script type="module" src="./app.js"></script>
</body>
</html>
